[project]
name = "labpilot"
version = "0.1.0"
description = "Dashboard, IPAM, memory planning and a Claude-powered chat assistant for a Proxmox home lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "proxmoxer>=2.1",
    "requests>=2.32",
    "httpx>=0.27",
    "pywinrm>=0.5",
    "anthropic>=0.70",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["labpilot*"]

[tool.setuptools.package-data]
labpilot = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
