<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Helper</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Lab Helper</h1>
    <nav id="tabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="guests">Guests</button>
      <button data-tab="inventory">Inventory</button>
      <button data-tab="ipam">IP addresses</button>
      <button data-tab="memory">Memory</button>
      <button data-tab="firewall">Firewall</button>
      <button data-tab="assistant">Assistant</button>
      <button data-tab="actions">Changes</button>
    </nav>
    <div class="spacer"></div>
    <button id="alert-badge" class="alert-badge" hidden title="Active alerts"></button>
    <span id="updated" class="muted"></span>
    <button id="refresh">Refresh</button>
  </header>

  <main>
    <section id="overview" class="tab active"></section>
    <section id="guests" class="tab"></section>
    <section id="inventory" class="tab"></section>
    <section id="ipam" class="tab"></section>
    <section id="memory" class="tab"></section>
    <section id="firewall" class="tab"></section>
    <section id="assistant" class="tab">
      <div id="assistant-layout">
        <div id="tasks"></div>
        <div id="chat">
          <div class="chat-head">
            <h2>Lab assistant</h2>
            <button id="chat-reset" class="small">New chat</button>
          </div>
          <div id="chat-log">
            <div class="msg bot">Hi! I'm Lab Helper. I can check your lab, walk you through Proxmox, pfSense, Docker, networking and other home lab tasks step by step, and queue changes for your approval. Pick a task on the left or ask anything.</div>
          </div>
          <form id="chat-form">
            <textarea id="chat-input" rows="3" placeholder="Ask Lab Helper… (Enter to send, Shift+Enter for a new line)"></textarea>
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </section>
    <section id="actions" class="tab"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
