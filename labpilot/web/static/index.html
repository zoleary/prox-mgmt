<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabPilot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>LabPilot</h1>
    <nav id="tabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="guests">Guests</button>
      <button data-tab="ipam">IP addresses</button>
      <button data-tab="memory">Memory</button>
      <button data-tab="firewall">Firewall</button>
      <button data-tab="actions">Changes</button>
    </nav>
    <div class="spacer"></div>
    <span id="updated" class="muted"></span>
    <button id="refresh">Refresh</button>
  </header>

  <div id="layout">
    <main>
      <section id="overview" class="tab active"></section>
      <section id="guests" class="tab"></section>
      <section id="ipam" class="tab"></section>
      <section id="memory" class="tab"></section>
      <section id="firewall" class="tab"></section>
      <section id="actions" class="tab"></section>
    </main>

    <aside id="chat">
      <div class="chat-head">
        <h2>Assistant</h2>
        <button id="chat-reset" class="small">New chat</button>
      </div>
      <div id="chat-log">
        <div class="msg bot">Ask about the lab, or ask me to change something. Changes wait for your approval.
          <div class="examples">
            <button class="example">Which node has the most memory headroom?</button>
            <button class="example">Find me a free IP on the servers VLAN</button>
            <button class="example">Are there any IP conflicts?</button>
          </div>
        </div>
      </div>
      <form id="chat-form">
        <textarea id="chat-input" rows="2" placeholder="Ask LabPilot…"></textarea>
        <button type="submit">Send</button>
      </form>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
